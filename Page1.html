<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theme Selection</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');

    * {
      font-family: "Outfit", sans-serif;
      font-optical-sizing: auto;
      font-weight: 800;
      font-style: normal;
    }

    .theme-card {
      border: 1px solid #ddd;
      border-radius: 5px;
      margin: 10px;
      padding: 20px;
    }

    .theme-card h3 {
      font-size: 20px;
    }

    .theme-card img {
      max-width: 100%;
      height: 200px;
    }

    .theme-card .btn {
      background-color: white;
      color: rgb(0, 136, 255);
      border: 1px solid rgb(0, 136, 255);
    }

    .theme-card .btn:hover {
      background-color: rgb(0, 136, 255);
      border: none;
      color: white;
    }

    .b1 {
      background-color: rgb(0, 136, 255);
      border: none;
      color: white;
      position: relative;
      left: 1000px;
      padding: 5px 30px;
      font-size: 18px;
    }

    .b1:hover {
      background-color: white;
      color: rgb(0, 136, 255);
      border: 1px solid rgb(0, 136, 255);
    }
  </style>
</head>

<body>
  <div class="container mt-5">
    <h2 class="mb-4">Apply a theme</h2>
    <div class="row">
      <div class="col-md-4">
        <div class="theme-card">
          <img src="assign 1.jpeg" alt="Bags theme" />
          <h3>Bags theme (recommended)</h3>
          <button class="btn">Apply</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="theme-card">
          <img src="assign 2.jpeg" alt="Flex theme" />
          <h3>Flex theme</h3>
          <button class="btn">Apply</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="theme-card">
          <img src="assign 3.jpeg" alt="Chic theme" />
          <h3>Chic theme</h3>
          <button class="btn">Apply</button>
        </div>
      </div>
    </div>
    <a href="Page2.html" target="_blank">
      <button class="btn b1 mt-4">Next</button>
    </a>
  </div>
</body>

</html>
