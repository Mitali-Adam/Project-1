<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Type and Category</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');

    * {
      font-family: "Outfit", sans-serif;
      font-optical-sizing: auto;
      font-weight: 700;
      font-style: normal;
    }

    .main-container {
      display: flex;
      justify-content: space-between;
      width: 80%;
      margin: 0 auto;
      margin-top: 50px;
      padding: 30px 0px;
      background-color: #f4f4f4;
    }

    .product-type-diagram {
      background-color: #CAF0D6;
      width: 45%;
    }

    .container button {
      position: relative;
      left: 420px;
      padding: 8px 30px;
      font-size: 18px;
      margin: 20px 18px;
    }
  </style>
</head>

<body>
  <div class="main-container mt-5">
    <div class="container mt-5 mr-5">
      <h2 class="mb-4">Let's add a type, Category and Sub-category</h2>
      <form>
        <div class="form-group">
          <label for="productType">Add a product type</label>
          <input type="text" class="form-control" id="productType" placeholder="e.g. books">
        </div>
        <div class="form-group">
          <label for="category">Add a category (optional)</label>
          <input type="text" class="form-control" id="category" placeholder="e.g. academic book">
        </div>
        <div class="form-group">
          <label for="subCategory">Add a sub-category (optional)</label>
          <input type="text" class="form-control" id="subCategory" placeholder="e.g. medical book">
        </div>
        <a href="Page2.html" target="_blank"><button type="button" class="btn btn-secondary">Back</button></a>
        <a href="Page3.html" target="_blank"><button type="button" class="btn btn-primary">Next</button></a>
      </form>
    </div>
    <div class="product-type-diagram">
      <img src="product.png" alt="Product Type Diagram">
    </div>
  </div>
</body>

</html>
